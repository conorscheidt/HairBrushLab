[project]
name = "lab-report"
version = "0.1.0"
description = "Reusable notebook styling and PDF export"
requires-python = ">=3.14"
dependencies = [
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "nbclient>=0.11.0",
    "nbconvert[webpdf]>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pygments>=2.21.0",
    "typer>=0.27.3",
]

[project.scripts]
lab-report = "lab_report.export:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
