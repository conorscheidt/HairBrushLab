[project]
name = "hairbrushlab"
version = "0.1.0"
description = "GEN_ENG-231 - Hair brush failure-strength lab"
authors = [
    { name = "Conor Scheidt", email = "c@crs.so" }
]
requires-python = ">=3.15"
dependencies = [
    "engstats>=0.3.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "lab-report",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "reporting",
]

[tool.uv.sources]
lab-report = { workspace = true, editable = true }
